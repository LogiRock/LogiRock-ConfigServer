networks:
  logirock-net:
    driver: bridge

services:
  # ==========================================
  # 1. BASES DE DATOS (Con Healthchecks)
  # ==========================================
  shipment-mysql:
    image: mysql:8.1
    container_name: shipment-mysql
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_DATABASE: shipment_db
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3308:3306"
    networks:
      - logirock-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  courier-mysql:
    image: mysql:8.1
    container_name: courier-mysql
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_DATABASE: courier_db
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3309:3306"
    networks:
      - logirock-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  security-mysql:
    image: mysql:8.1
    container_name: security-mysql
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_DATABASE: security_db
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3310:3306"
    networks:
      - logirock-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==========================================
  # 2. SERVIDOR DE CONFIGURACIÓN
  # ==========================================
  config-server:
    image: logirockjujuy/config-server:v2.0.0
    container_name: config-server
    restart: unless-stopped
    environment:
      PORT: 8088
      GIT_URI: https://github.com/LogiRock/config-server.git
      GIT_BRANCH: ${CONFIG_GIT_BRANCH:-develop}
      SPRING_CLOUD_CONFIG_SERVER_GIT_REFRESH_RATE: 60
    ports:
      - "8088:8088"
    networks:
      - logirock-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/application/default > /dev/null || exit 1"]
      interval: 10s
      timeout: 15s
      retries: 15
      start_period: 60s

  # ==========================================
  # 3. DESCUBRIMIENTO DE SERVICIOS (Eureka)
  # ==========================================
  eureka-server:
    image: logirockjujuy/eureka-server:v1.0.0
    container_name: eureka-server
    restart: unless-stopped
    environment:
      - CONFIG_SERVER_URL=http://config-server:8088
    ports:
      - "8065:8065"
    networks:
      - logirock-net
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8065/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  # ==========================================
  # 4. MICROSERVICIOS
  # ==========================================
  shipment-service:
    image: logirockjujuy/shipment-service:v2.0.1
    container_name: shipment-service
    restart: on-failure
    env_file: .env
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8088
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - SPRING_DATASOURCE_URL=jdbc:mysql://shipment-mysql:3306/shipment_db
      - EUREKA_URL=http://eureka-server:8065/eureka/
    ports:
      - "8080:8080"   # Swagger para la review
    networks:
      - logirock-net
    depends_on:
      shipment-mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  courier-service:
    image: logirockjujuy/courier-service:v2.0.1
    container_name: courier-service
    restart: on-failure
    env_file: .env
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8088
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - SPRING_DATASOURCE_URL=jdbc:mysql://courier-mysql:3306/courier_db
      - EUREKA_URL=http://eureka-server:8065/eureka/
    ports:
      - "8082:8082"   # Swagger para la review
    networks:
      - logirock-net
    depends_on:
      courier-mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  security-service:
    image: logirockjujuy/security-service:v2.0.0
    container_name: security-service
    restart: on-failure
    env_file: .env
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8088
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - SPRING_DATASOURCE_URL=jdbc:mysql://security-mysql:3306/security_db
      - EUREKA_URL=http://eureka-server:8065/eureka/
    ports:
      - "8081:8081"   # Swagger para la review
    networks:
      - logirock-net
    depends_on:
      security-mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # ==========================================
  # 5. API GATEWAY (puerta de entrada única)
  # ==========================================
  api-gateway:
    image: logirockjujuy/api-gateway:${API_GATEWAY_TAG:-v1.0.0}
    container_name: api-gateway
    restart: on-failure
    environment:
      - CONFIG_SERVER_URL=http://config-server:8088
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - EUREKA_URL=http://eureka-server:8065/eureka/
      - FRONTEND_ORIGINS=${FRONTEND_ORIGINS:-http://localhost:5173,http://localhost:3000}
    ports:
      - "8066:8066"
    networks:
      - logirock-net
    depends_on:
      eureka-server:
        condition: service_healthy
      shipment-service:
        condition: service_healthy
      courier-service:
        condition: service_healthy
      security-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8066/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s